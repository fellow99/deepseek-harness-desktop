name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows 同时产出 Squirrel 安装器与 zip 目录包，但二者串行在单个 job 内会超过
        # 60 分钟超时（打包本身约 25min，Squirrel 再耗数十分钟）。拆成两个独立 job，
        # 各自完整构建但只跑一个 maker，可并行且各自不超时。Linux/macOS 保持单 job。
        include:
          - name: windows-squirrel
            os: windows-latest
            targets: squirrel
          - name: windows-zip
            os: windows-latest
            targets: zip
          - name: linux
            os: ubuntu-latest
            targets: ''
          - name: macos
            os: macos-latest
            targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    name: build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v7

      # 本工程经 ../deepseek-harness 同级源码引用 dsh（非 submodule）。
      # actions/checkout 的 path 限制在 $GITHUB_WORKSPACE 内，故改用 git clone 到同级目录。
      - name: Checkout dsh (sibling)
        shell: bash
        run: |
          git clone --depth 1 --branch "dsh-v0.1.0-rc.7" \
            https://github.com/deepseek-ai/deepseek-harness.git ../deepseek-harness

      # dsh-market（插件市场）同样以 ../dsh-market 同级源码引用：collect-dsh.mjs 会把其
      # 构建产物物化为 dsh-dist/node_modules/dshmarket，缺失则打包硬失败。tag v1.26.0。
      - name: Checkout dsh-market (sibling)
        shell: bash
        run: |
          git clone --depth 1 --branch "v1.26.0" \
            https://github.com/dsh-market/dsh-market.git ../dsh-market

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # dsh 脚本用 `corepack pnpm`，且 dsh 的 build 脚本内部还有嵌套的 `pnpm` 调用，
      # 需 corepack enable 创建 pnpm shim 到 PATH，否则嵌套调用报 `pnpm: not found`。
      - name: Enable corepack
        run: corepack enable

      # maker-deb 需 fakeroot + dpkg（dpkg 已预装）；maker-rpm 需 rpmbuild（rpm 包提供）。
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build dsh (apply patches + build)
        run: npm run build:dsh

      # 非 Windows job 不指定 --targets，跑该平台所有 maker（linux: deb/rpm/zip；macos: dmg/zip）。
      - name: Make
        shell: bash
        run: |
          if [ -n "${{ matrix.targets }}" ]; then
            npm run make -- --targets "${{ matrix.targets }}"
          else
            npm run make
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: out/make/
          if-no-files-found: error
