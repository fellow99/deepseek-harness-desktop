name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 本工程经 ../deepseek-harness 同级源码引用 dsh（非 submodule），
      # 用第二次 checkout 复现与本机一致的 sibling 布局。
      - name: Checkout dsh (sibling)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: ../deepseek-harness
          ref: dsh-v0.1.0-rc.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # pnpm 官方推荐（已弃用 corepack）；dsh 是 pnpm monorepo，collect-dsh 需 pnpm deploy。
      - uses: pnpm/setup@v2
        with:
          version: 11.7.0

      # maker-deb 需 fakeroot + dpkg（dpkg 已预装）；maker-rpm 需 rpmbuild（rpm 包提供）。
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build dsh (apply patches + build)
        run: npm run build:dsh

      - name: Make
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: out/make/
          if-no-files-found: error
