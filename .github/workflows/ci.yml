name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # 本工程经 ../deepseek-harness 同级源码引用 dsh（非 submodule）。
      # actions/checkout 的 path 限制在 $GITHUB_WORKSPACE 内，故改用 git clone 到同级目录。
      - name: Checkout dsh (sibling)
        shell: bash
        run: |
          git clone --depth 1 --branch "dsh-v0.1.0-rc.7" \
            https://github.com/deepseek-ai/deepseek-harness.git ../deepseek-harness

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # dsh 脚本内部用 `corepack pnpm` 调用 pnpm（corepack 由 Node 22 自带），无需额外安装 pnpm。

      # maker-deb 需 fakeroot + dpkg（dpkg 已预装）；maker-rpm 需 rpmbuild（rpm 包提供）。
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build dsh (apply patches + build)
        run: npm run build:dsh

      - name: Make
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: out/make/
          if-no-files-found: error
